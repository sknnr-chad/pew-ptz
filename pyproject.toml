[project]
name = "pew-ptz"
version = "1.0.0"
description = "Phone-based PTZ camera controller with one-tap Zoom mute/video toggles. Drives any VISCA-over-IP PTZ; reads ground-truth Zoom state via Windows UI Automation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "flask>=3.1.3,<4",
    "pynput>=1.8.2,<2",
    "uiautomation>=2.0.29,<3 ; sys_platform == 'win32'",
    # Imported directly by zoom_state.py, so declare it rather than relying
    # on uiautomation to pull it in.
    "comtypes>=1.4.17,<2 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Pinned to a minor: ruff adds/changes lint rules between minors.
dev = ["ruff~=0.16.9"]

[project.scripts]
pew-ptz = "pew_ptz.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pew_ptz"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
