<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>{{ title }}</title>
  <!-- PWA: lets the operator "Add to Home Screen" and launch full-screen,
       which on a phone-as-controller is a big deal (no browser chrome
       eating screen space). Wake Lock proper requires HTTPS; the inline
       fallback in app.js keeps the screen on over plain HTTP/LAN too. -->
  <link rel="manifest" href="/static/manifest.json" />
  <!-- apple-touch-icon: iOS works with PNG on all versions and SVG only on
       14+. PNG it is — keeps older devices working too. -->
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{ title }}" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <a class="help-fab" href="/help" aria-label="Help">?</a>
  <div class="preview-wrap" id="previewWrap">
    <img id="preview" alt="Live preview"
         src="http://{{ camera_ip }}{{ camera_snapshot_path }}" />
    <svg class="thirds-overlay" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0"   y1="100" x2="300" y2="100" />
      <line x1="0"   y1="200" x2="300" y2="200" />
      <line x1="100" y1="0"   x2="100" y2="300" />
      <line x1="200" y1="0"   x2="200" y2="300" />
    </svg>
    <button class="thirds-toggle" id="thirdsToggle" aria-label="Toggle rule-of-thirds overlay">
      <svg viewBox="0 0 24 24"><path d="M2 8 H22 M2 16 H22 M8 2 V22 M16 2 V22" /></svg>
    </button>
  </div>

  <div class="card" id="presetsCard">
    <div class="card-head">
      <h2>Presets</h2>
      <select id="wardSelect" aria-label="Active ward" hidden></select>
      <button class="edit-toggle" id="editToggle" aria-pressed="false">Edit</button>
    </div>
    <div class="edit-banner" id="editBanner" hidden>
      Edit mode: tap a preset to save the current view to it or rename it.
      <button class="copy-btn" id="copyBtn" hidden></button>
    </div>
    <div class="copy-progress" id="copyProgress" hidden>
      <span id="copyText"></span>
      <button id="copyCancel">Stop</button>
    </div>
    <div class="presets" id="presets"></div>
  </div>

  <!-- Camera: zoom buttons flank the D-pad so all movement is in one thumb area. -->
  <div class="card">
    <div class="ptz">
      <button class="zoombtn" data-zoom="wide" aria-label="Zoom out">−<small>zoom</small></button>
      <div class="dpad">
        <button data-dir="up_left" aria-label="Up left">↖</button>
        <button data-dir="up" aria-label="Up">↑</button>
        <button data-dir="up_right" aria-label="Up right">↗</button>
        <button data-dir="left" aria-label="Left">←</button>
        <button class="home" id="homeBtn">HOME</button>
        <button data-dir="right" aria-label="Right">→</button>
        <button data-dir="down_left" aria-label="Down left">↙</button>
        <button data-dir="down" aria-label="Down">↓</button>
        <button data-dir="down_right" aria-label="Down right">↘</button>
      </div>
      <button class="zoombtn" data-zoom="tele" aria-label="Zoom in">+<small>zoom</small></button>
    </div>
    <div class="mode">
      <span class="mode-label">Speed</span>
      <button data-speed="6" class="active">Slow</button>
      <button data-speed="12">Med</button>
      <button data-speed="20">Fast</button>
    </div>
  </div>

  <!-- Zoom meeting: the buttons show the current state; pills appear only
       when something needs attention. -->
  <div class="card">
    <button class="air" id="airBtn"><span id="airLabel">ON AIR / OFF AIR</span>
      <small id="airHint">tap to toggle video + mic</small></button>
    <div class="air-row">
      <button id="vidBtn">Video</button>
      <button id="micBtn">Mic</button>
    </div>
    <div class="status" id="zoomStatus"></div>
  </div>

  <!-- Edit-mode actions for one preset. -->
  <div class="sheet" id="presetSheet" hidden>
    <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-title" id="sheetTitle"></div>
      <div class="sheet-sub" id="sheetSub"></div>
      <button class="sheet-save" id="sheetSave">Save current view here</button>
      <button id="sheetRename">Rename…</button>
      <button class="sheet-cancel" id="sheetCancel">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>window.PEW_PRESETS = {{ presets | tojson }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
