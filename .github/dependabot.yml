version: 2

updates:
  # Python runtime dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      # Bundle minor + patch bumps into one PR per ecosystem to cut noise.
      # Major bumps still get their own PR so the breaking-change review
      # is forced.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA
  # and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
